<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Enchanted Garden | Hotspot Test V02</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#132219;color:#f7f0d4;font-family:Georgia,serif}body{display:flex;flex-direction:column;align-items:center}.top{width:min(100%,1300px);display:flex;gap:10px;justify-content:space-between;align-items:center;padding:10px 14px;flex-wrap:wrap}.top strong{font-size:clamp(15px,2vw,23px)}.actions{display:flex;gap:7px;flex-wrap:wrap}button{cursor:pointer} .ctl{font:600 13px system-ui,sans-serif;background:#f7eac3;color:#203c2b;border:1px solid #b5a16c;border-radius:9px;padding:8px 12px}.stage{position:relative;width:min(100vw,1300px);aspect-ratio:1672/941;overflow:hidden;isolation:isolate;background:#24402d;touch-action:manipulation}.stage img{position:absolute;width:100%;height:100%;inset:0;object-fit:fill;user-select:none;pointer-events:none}.scene2{z-index:2;clip-path:circle(0% at 90% 25%);opacity:0}.stage.reveal .scene2{opacity:1;animation:water-reveal 3.6s cubic-bezier(.16,.66,.2,1) forwards}@keyframes water-reveal{0%{clip-path:circle(0% at 90% 25%);filter:blur(16px) saturate(1.5)}20%{filter:blur(7px)}100%{clip-path:circle(155% at 90% 25%);filter:blur(0)}}.ripple{position:absolute;z-index:5;left:90%;top:25%;width:10px;height:10px;border:3px solid #d5fbff;border-radius:50%;transform:translate(-50%,-50%) scale(.1);opacity:0;pointer-events:none}.stage.reveal .ripple{animation:ripple 2.6s ease-out forwards}@keyframes ripple{10%{opacity:.9}100%{opacity:0;transform:translate(-50%,-50%) scale(125)}}.hotspot{position:absolute;z-index:4;transform:translate(-50%,-50%);border:2px solid transparent;border-radius:50%;background:transparent;cursor:pointer;touch-action:manipulation;padding:0;outline-offset:3px}.hotspot:focus-visible{outline:3px solid white}.debug .hotspot{border:2px dashed #ffeb3b;background:#ffec4470}.debug .hotspot:after{content:attr(data-number);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#17230b;background:#fff5a6;border-radius:50%;padding:3px 7px;font:700 13px system-ui,sans-serif}.hotspot.done{pointer-events:none}.hotspot.done:not(.debug .hotspot){border-color:transparent}.pulse{position:absolute;z-index:6;pointer-events:none;border-radius:50%;border:3px solid #fff6bd;box-shadow:0 0 20px #ffec8c;transform:translate(-50%,-50%);animation:pop .85s ease-out forwards}@keyframes pop{from{opacity:1;scale:.5}to{opacity:0;scale:1.8}}.stage.reveal .hotspot{pointer-events:none;opacity:0}.bottom{width:min(100%,1300px);padding:12px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font:14px system-ui,sans-serif}.status{flex:1}.progress{font-weight:700;white-space:nowrap}.hint{opacity:.8;font-size:12px;margin:0 15px 12px;align-self:center;text-align:center} @media(max-width:600px){.top{padding:7px}.ctl{font-size:12px;padding:7px}.bottom{font-size:12px;padding:8px}.hint{font-size:11px}}@media(orientation:portrait) and (max-width:700px){.stage{margin-top:10vh}}

/* V02: fullscreen the entire interactive shell so controls remain accessible. */
.shell{width:100%;display:flex;flex-direction:column;align-items:center;min-height:0}
.shell:fullscreen,.shell.fallback-fullscreen{width:100vw;height:100dvh;max-width:none;background:#132219;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:auto;padding:4px 8px}
.shell:fullscreen .top,.shell.fallback-fullscreen .top{flex:0 0 auto;width:100%;max-width:none;padding:4px 8px}
.shell:fullscreen .stage,.shell.fallback-fullscreen .stage{flex:0 1 auto;width:min(calc(100vw - 16px), calc((100dvh - 115px)*1672/941));max-width:100%;height:auto;aspect-ratio:1672/941;margin:0}
.shell:fullscreen .bottom,.shell.fallback-fullscreen .bottom{flex:0 0 auto;width:100%;max-width:none;padding:5px 8px}
.shell:fullscreen .hint,.shell.fallback-fullscreen .hint{flex:0 0 auto;margin:3px 8px;font-size:10px}
body.fallback-active{overflow:hidden}
@media(max-height:460px){.shell:fullscreen .hint,.shell.fallback-fullscreen .hint{display:none}.shell:fullscreen .stage,.shell.fallback-fullscreen .stage{width:min(calc(100vw - 16px), calc((100dvh - 82px)*1672/941))}}
</style></head><body><div class="shell" id="shell"><header class="top"><strong>🌿 The Enchanted Garden · Hotspot Test V02</strong><div class="actions"><button class="ctl" id="debug" aria-pressed="false">Show hotspot outlines</button><button class="ctl" id="reset">Start over</button><button class="ctl" id="fullscreen">Full Screen</button></div></header><main class="stage" id="stage" aria-label="Interactive garden mystery"><img src="garden_scene_1.png" alt="Garden filled with animals, birds and flowers"><img class="scene2" src="garden_scene_2.png" alt="Garden with stream and pond"><div class="ripple"></div></main><footer class="bottom"><span class="status" id="status" role="status" aria-live="polite">Find the first creature. Tap animals to discover the hidden sequence.</span><span class="progress" id="progress">0 / 14</span></footer><p class="hint">Testing mode: choose “Show hotspot outlines” to check exact animal positions. Outlines are hidden during normal play.</p></div>
<script>
'use strict';
// Hotspot centers and sizes are percentages of the original 1672×941 Scene 1 image.
// Correct order: ladybug, caterpillar, bee, butterfly, turtle, mouse, rabbit,
// longhorn, skunk, opossum, raccoon, bluebird, hummingbird, spider.
const creatures=[
{name:'Ladybug',x:86.9,y:93.0,w:4.2,h:6.5},
{name:'Caterpillar',x:67.0,y:86.5,w:8.5,h:8.0},
{name:'Bumblebee',x:91.0,y:82.2,w:7.5,h:10.5},
{name:'Butterfly',x:6.7,y:33.8,w:10,h:13},
{name:'Turtle',x:11.7,y:86.5,w:12,h:10},
{name:'Mouse',x:39.0,y:91.0,w:8.5,h:10},
{name:'Rabbit',x:12.5,y:66.5,w:10,h:14},
{name:'Texas Longhorn',x:49.6,y:30.0,w:8.5,h:11},
{name:'Skunk',x:24.4,y:47.0,w:8,h:14},
{name:'Opossum',x:85.3,y:73.0,w:11,h:16},
{name:'Raccoon',x:91.1,y:45.3,w:10.5,h:15},
{name:'Bluebird',x:35.1,y:42.8,w:12,h:11},
{name:'Hummingbird',x:66.3,y:15.6,w:9.5,h:13},
{name:'Spider',x:91.0,y:26.1,w:5,h:10}
];
const stage=document.getElementById('stage'),status=document.getElementById('status'),progress=document.getElementById('progress');let step=0,complete=false;
function showStatus(t){status.textContent=t}
function mark(c){const el=document.createElement('span');el.className='pulse';el.style.left=c.x+'%';el.style.top=c.y+'%';el.style.width=Math.max(c.w,c.h)*.65+'%';el.style.aspectRatio='1';stage.appendChild(el);el.addEventListener('animationend',()=>el.remove())}
creatures.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.className='hotspot';b.setAttribute('aria-label',c.name);b.dataset.number=i+1;b.style.left=c.x+'%';b.style.top=c.y+'%';b.style.width=c.w+'%';b.style.height=c.h+'%';b.addEventListener('click',()=>{if(complete)return;if(i!==step){showStatus('The garden rustles, but nothing changes. Try another creature.');return}step++;progress.textContent=step+' / 14';b.classList.add('done');mark(c);if(step===creatures.length){complete=true;showStatus('The spider awakens the water! A new garden is appearing…');stage.classList.add('reveal');setTimeout(()=>showStatus('The second garden has been revealed. Scene 2 hotspots are not built yet.'),3900)}else showStatus(c.name+' responds! The garden is listening…')});stage.appendChild(b)});
document.getElementById('debug').addEventListener('click',e=>{let on=stage.classList.toggle('debug');e.currentTarget.textContent=on?'Hide hotspot outlines':'Show hotspot outlines';e.currentTarget.setAttribute('aria-pressed',String(on))});
document.getElementById('reset').addEventListener('click',()=>{step=0;complete=false;stage.classList.remove('reveal');progress.textContent='0 / 14';stage.querySelectorAll('.hotspot').forEach(b=>b.classList.remove('done'));stage.querySelectorAll('.pulse').forEach(b=>b.remove());showStatus('Garden reset. Find the first creature.')});
const shell=document.getElementById('shell'), fullButton=document.getElementById('fullscreen');
function updateFullButton(){fullButton.textContent=(document.fullscreenElement||shell.classList.contains('fallback-fullscreen'))?'Exit Full Screen':'Full Screen'}
document.addEventListener('fullscreenchange',updateFullButton);
fullButton.addEventListener('click',async()=>{
  if(shell.classList.contains('fallback-fullscreen')){shell.classList.remove('fallback-fullscreen');document.body.classList.remove('fallback-active');updateFullButton();return}
  if(document.fullscreenElement){try{await document.exitFullscreen()}catch(e){}updateFullButton();return}
  try{if(!shell.requestFullscreen)throw new Error('Fullscreen API unavailable');await shell.requestFullscreen();updateFullButton()}
  catch(e){shell.classList.add('fallback-fullscreen');document.body.classList.add('fallback-active');updateFullButton();showStatus('Expanded view active. Tap Exit Full Screen to return.');}
});
</script></body></html>
