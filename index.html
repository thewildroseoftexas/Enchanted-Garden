A NOTE TO THOSE WHO PEEK BEHIND THE LEAVES

The garden keeps its secrets well,
Not every root has tales to tell.
Close this page of hidden art,

For treasures found by eyes and hand
Bloom brighter than the ones you scanned.

/* V02: fullscreen the entire interactive shell so controls remain accessible. */
.shell{width:100%;display:flex;flex-direction:column;align-items:center;min-height:0}
.shell:fullscreen,.shell.fallback-fullscreen{width:100vw;height:100dvh;max-width:none;background:#132219;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:auto;padding:4px 8px}

.shell:fullscreen .bottom,.shell.fallback-fullscreen .bottom{flex:0 0 auto;width:100%;max-width:none;padding:5px 8px}

/* V03: natural ladybug lift-off, enlarged readable feedback, and robust fullscreen sizing. */
.ladybug-sprite{position:absolute!important;z-index:3;left:84.75%!important;top:89.80%!important;width:4.37%!important;height:5.53%!important;object-fit:fill;transform-origin:center;pointer-events:none}
.ladybug-sprite.depart{animation:ladybug-depart 2.5s cubic-bezier(.25,.1,.2,1) forwards}
@keyframes ladybug-depart{0%{transform:translate(0,0) scale(1);opacity:1}12%{transform:translate(0,-5%) rotate(-5deg) scale(1.03)}30%{transform:translate(-15%,-85%) rotate(-16deg) scale(.9)}65%{transform:translate(75%,-380%) rotate(12deg) scale(.58)}100%{transform:translate(180%,-750%) rotate(20deg) scale(.12);opacity:0}}
/* Three times the former 14px feedback size, with responsive safeguards. */
.bottom .status{font-size:clamp(20px,3.1vw,42px);line-height:1.15;font-weight:700;text-shadow:0 1px 2px #07120a}
.bottom .progress{font-size:clamp(16px,2vw,24px)}
.bottom{align-items:center;min-height:62px}
.shell:fullscreen,.shell.fallback-fullscreen{justify-content:center}

@media(max-height:460px){.bottom .status{font-size:clamp(17px,2.4vw,32px)}.shell:fullscreen .stage,.shell.fallback-fullscreen .stage{width:min(calc(100vw - 16px),calc((100dvh - 125px)*1672/941))}}

/* V05: independent two-wing flight with transparent ladybug cutout */
.ladybug-flight{position:absolute;z-index:3;left:84.75%;top:89.8%;width:4.37%;height:5.53%;pointer-events:none;transform-origin:50% 45%}
.ladybug-flight .ladybug-sprite{position:absolute!important;left:0!important;top:0!important;width:100%!important;height:100%!important;object-fit:contain!important;z-index:2}
.flight-wing{position:absolute;z-index:1;top:21%;width:55%;height:48%;background:linear-gradient(130deg,rgba(255,255,237,.94),rgba(216,244,233,.72) 65%,rgba(255,255,255,.36));border:1px solid rgba(104,93,56,.8);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);border-radius:85% 15% 85% 15%;opacity:0;transform-origin:100% 75%}
.wing-left{left:-25%;transform:rotate(-25deg) scale(.2)}.wing-right{right:-25%;transform-origin:0% 75%;border-radius:15% 85% 15% 85%;transform:rotate(25deg) scale(.2)}
.ladybug-flight.depart{animation:ladybug-v05-depart 2.8s ease-in-out forwards}

.ladybug-flight.depart .wing-right{animation-name:wingbeat-right}
@keyframes wingbeat-left{from{transform:rotate(-25deg) scale(.65)}to{transform:rotate(-75deg) scale(1)}}
@keyframes wingbeat-right{from{transform:rotate(25deg) scale(.65)}to{transform:rotate(75deg) scale(1)}}
@keyframes ladybug-v05-depart{0%{transform:translate(0,0) scale(1);opacity:1}13%{transform:translate(0,-8%) scale(1.02);opacity:1}40%{transform:translate(-25%,-125%) rotate(-8deg) scale(.95);opacity:1}72%{transform:translate(85%,-425%) rotate(8deg) scale(.62);opacity:1}100%{transform:translate(195%,-760%) rotate(13deg) scale(.18);opacity:0}}
@media(prefers-reduced-motion:reduce){.ladybug-flight.depart{animation-duration:.15s}.ladybug-flight.depart .flight-wing{animation:none}}

/* V06: three fireflies, shared by all fourteen original-artwork creatures. */
.firefly-group{position:absolute;z-index:7;pointer-events:none;width:0;height:0;left:0;top:0;overflow:visible}
.firefly{position:absolute;left:0;top:0;width:clamp(5px,0.95vw,13px);height:clamp(5px,0.95vw,13px);border-radius:50%;background:radial-gradient(circle at 38% 35%,#fffef1 0 18%,#fff8b5 25%,#ffd751 52%,#f9a51d 75%,transparent 85%);box-shadow:0 0 7px 3px #ffe78c,0 0 18px 7px #ffc33e90,0 0 28px 12px #ffeb8060;opacity:0;transform:translate(-50%,-50%);animation:firefly-dance 3s ease-in-out both;animation-delay:var(--delay)}
